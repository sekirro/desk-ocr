appId: io.github.sekirro.deskocr
productName: Desk OCR
artifactName: Desk-OCR-${version}-Windows-${arch}.${ext}

directories:
  output: release/electron

files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: release/ocr/desk-ocr-service
    to: ocr
  - from: release/licenses
    to: licenses

win:
  icon: build/icon.ico
  executableName: Desk OCR
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desk OCR
