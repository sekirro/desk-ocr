name: Preview release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr/requirements-base.txt
            services/ocr/requirements-dev.txt
            services/ocr/requirements-packaging.txt
            services/ocr/requirements-windows-lock.txt
      - run: npm ci
      - run: npm run install:python:packaging
      - run: npm run check
      - run: npm run dist:win:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: desk-ocr-windows-x64
          path: |
            release/electron/Desk-OCR-*.exe
            release/electron/*.blockmap
            release/electron/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr/requirements-base.txt
            services/ocr/requirements-dev.txt
            services/ocr/requirements-packaging.txt
            services/ocr/requirements-macos-arm64-lock.txt
      - run: npm ci
      - run: npm run install:python:packaging
      - run: npm run check
      - run: npm run dist:mac:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: desk-ocr-macos-arm64
          path: |
            release/electron/Desk-OCR-*-macOS-arm64.dmg
            release/electron/Desk-OCR-*-macOS-arm64.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-ocr-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Desk OCR $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --generate-notes --title "Desk OCR $GITHUB_REF_NAME"
          fi
