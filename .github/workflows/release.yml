name: Windows preview release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr/requirements-base.txt
            services/ocr/requirements-dev.txt
            services/ocr/requirements-packaging.txt
            services/ocr/requirements-windows-lock.txt
      - run: npm ci
      - run: npm run install:python:packaging
      - run: npm run check
      - run: npm run dist:win:artifacts
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/electron/Desk-OCR-*.exe, release/electron/*.blockmap, release/electron/latest.yml
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("$PWD/release/electron/SHA256SUMS.txt", $lines)
      - uses: actions/upload-artifact@v4
        with:
          name: desk-ocr-windows-x64
          path: |
            release/electron/Desk-OCR-*.exe
            release/electron/*.blockmap
            release/electron/latest.yml
            release/electron/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desk-ocr-windows-x64
          path: release-assets
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Desk OCR $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --generate-notes --title "Desk OCR $GITHUB_REF_NAME"
          fi
