name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the workflow and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and platform impact
      description: Does this add persistence, networking, permissions, native dependencies, or platform-specific behavior?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
